<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wenare · Maquette des prochains passages</title>
<style>
:root{color-scheme:light;--bg:#eef4f1;--card:#fff;--ink:#18312b;--muted:#496258;--edge:#c6d7cf;--accent:#176346;--soft:#e4f1e9;font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
html[data-theme=dark]{color-scheme:dark;--bg:#12211b;--card:#1d3027;--ink:#eff9f0;--muted:#c0d1c6;--edge:#486255;--accent:#ace5c3;--soft:#294b39}
*{box-sizing:border-box}body{max-width:680px;margin:auto;padding:22px 16px 36px}header,.tools,.passes,.direction{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between}a{color:var(--accent)}h1{font-size:1.65rem;margin:26px 0 4px}h2{margin:0;font-size:1.35rem}p{line-height:1.5}button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:8px 10px}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #4084c2;outline-offset:3px}.note,small{color:var(--muted)}.note{margin:0 0 16px}.card,dialog{border:1px solid var(--edge);background:var(--card);border-radius:16px;color:var(--ink)}.card{padding:18px}.direction{margin:10px 0 18px}.badge{border-radius:6px;background:#80bb61;color:#122519;font-weight:750;padding:3px 8px}.passes{gap:26px}.slot{display:grid;gap:3px;justify-items:start}.tap{border:0;background:transparent;padding:8px 0;min-height:44px}.block{display:inline-grid;place-items:center;width:56px;height:24px;border-radius:5px;background:#dcfce7;color:#14261a;border:1px solid #93c6a6;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}.block.live{color:#9d1728}.urgent{animation:shake 2.4s ease-in-out infinite}@keyframes shake{0%,18%,100%{transform:translateX(0)}4%,12%{transform:translateX(-2px)}8%,16%{transform:translateX(2px)}}@media(prefers-reduced-motion:reduce){.urgent{animation:none}}
.legend{margin:12px 0 0;font-size:.88rem;color:var(--muted)}.tools{margin:14px 0}.tools label{display:grid;gap:4px}.tools button[aria-pressed=true]{background:var(--soft)}dialog{width:min(95vw,500px);padding:18px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#10251cc2}dialog h2{font-size:1.15rem}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--edge);vertical-align:top}td small{display:block}tr.selected{background:var(--soft)}.why{line-height:1.5}dialog button{float:right}
dialog::backdrop{background:#10251c96}dialog{padding:clamp(14px,4vw,24px)}dialog h2{font-size:1.35rem}dialog .route{margin:.4rem 0 1rem}.chosen{display:flex;gap:12px;align-items:center;padding:12px 0;border-block:1px solid var(--edge);margin-bottom:14px}.chosen strong{font-size:.95rem}dialog .why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:16px 0}dialog tr.selected th{color:var(--accent)}dialog td small{margin-top:3px}dialog button{min-height:44px}
</style></head><body>
<header><a href="../../">← Wenare</a><button id="theme">Changer de thème</button></header>
<h1>Prochains passages</h1><p class="note">Maquette interactive · horaires fictifs</p>
<main><section class="card"><h2>Reine Blanche</h2><p class="direction"><span class="badge">6501</span> → Maison des Insectes</p><div class="passes" id="passes"></div>
</section>
<div class="tools"><label>Scénario<select id="scenario"><option value="normal">Deux bus à Reine Blanche</option><option value="imminent">Estimation à 2 minutes</option><option value="limit">Estimation à 5 minutes</option><option value="delay">Passage retardé à 8 minutes</option><option value="past">Horaire officiel déjà passé</option></select></label></div>
<div class="tools"><button id="expiry" aria-pressed="false">Simuler l’expiration</button><button id="projection" aria-pressed="false">Se projeter à 12 h 15</button></div><small id="clock" role="status"></small></main>
<dialog id="detail" aria-labelledby="title"><h2 id="title">Reine Blanche</h2><p class="route"><span class="badge">6501</span> → Maison des Insectes</p><div class="chosen"><span id="chosen" class="block"></span><strong id="source"></strong></div><table><thead><tr><th scope="col">Passage</th><th scope="col">Officiel</th><th scope="col">Estimation</th></tr></thead><tbody id="rows"></tbody></table><p id="why" class="why"></p><form method="dialog"><button autofocus>Fermer</button></form></dialog>
<script>
const $=id=>document.getElementById(id);
const minute=60, base=(11*60+42)*minute, projectedAt=(12*60+15)*minute;
let expired=false,projected=false,opener=null;
const hhmm=s=>new Date(s*1000).toISOString().slice(11,16).replace(':',' h ');
const label=(s,ref)=>s<=ref?hhmm(s):Math.ceil((s-ref)/minute)+'′';
function visits(mode){
  const row=(offset,eta=null,age=0)=>({official:base+offset*minute,eta:eta===null?null:base+eta*minute,source:base-age});
  const normal=[row(-4),row(11,5,617),row(26,20,33),row(42),row(57),row(72)];
  if(mode==='normal')return normal;
  const settings={imminent:[8,2],limit:[3,5],delay:[2,8],past:[-4,3]};
  const [planned,estimate]=settings[mode];return [row(-19),row(planned,estimate,10),row(26),row(42),row(57),row(72)];
}
function model(v,ref,isProjection){
  const age=ref-v.source,live=!isProjection && v.eta!==null && age>=-15 && age<120;
  const time=live?v.eta:v.official;
  return {age,live,value:isProjection?hhmm(v.official):label(time,ref),urgent:live&&time>ref&&time-ref<300};
}
function state(){
  const list=visits($('scenario').value),ref=projected?projectedAt:base+(expired?90:0);
  const start=list.findIndex(v=>(!projected&&model(v,ref,false).live?v.eta:v.official)>ref);
  return {list,ref,start};
}
function render(){
  const {list,ref,start}=state();$('passes').replaceChildren();
  list.slice(start,start+2).forEach((v,i)=>{
    const m=model(v,ref,projected),slot=document.createElement('div'),tag=document.createElement('small'),button=document.createElement('button'),block=document.createElement('span');
    slot.className='slot';tag.textContent=i?'Suivant':'Prochain';button.className='tap';button.setAttribute('aria-haspopup','dialog');
    button.setAttribute('aria-label',tag.textContent+' : '+m.value+', '+(m.live?'estimation temps réel':'horaire officiel')+', voir le détail');
    block.className='block'+(m.live?' live':'')+(m.urgent?' urgent':'');block.textContent=m.value;button.append(block);button.onclick=()=>show(start+i,button);slot.append(tag,button);$('passes').append(slot);
  });
  $('clock').textContent=(projected?'Projection à ':'Situation à ')+hhmm(ref)+'.';$('expiry').disabled=projected;
  $('expiry').setAttribute('aria-pressed',String(expired));$('expiry').textContent=expired?'Revenir avant l’expiration':'Simuler l’expiration';
  $('projection').setAttribute('aria-pressed',String(projected));$('projection').textContent=projected?'Revenir à maintenant':'Se projeter à 12 h 15';
}
function show(index,button){
  opener=button;const {list,ref}=state(),v=list[index],m=model(v,ref,projected);$('rows').replaceChildren();
  $('chosen').textContent=m.value;$('chosen').className='block'+(m.live?' live':'');
  $('source').textContent=m.live?'Estimation temps réel':'Horaire officiel';
  for(const [delta,name] of [[-1,'Précédent'],[0,'Sélectionné'],[1,'Suivant']]){
    const item=list[index+delta],tr=document.createElement('tr');if(!delta)tr.className='selected';
    const head=document.createElement('th');head.scope='row';head.textContent=name;const off=document.createElement('td'),eta=document.createElement('td');
    off.textContent=item?hhmm(item.official):'—';eta.textContent='—';
    if(item&&delta>=0){
      const obs=model(item,ref,projected);
      if(projected)eta.textContent='Théorique seul';
      else if(item.eta===null)eta.textContent='Indisponible';
      else{eta.textContent=hhmm(item.eta);const status=document.createElement('small');status.textContent=obs.live?'Actualisée il y a '+obs.age+' s':'Dernière estimation connue · périmée';eta.append(status);}
    }
    tr.append(head,off,eta);$('rows').append(tr);
  }
  let why;
  if(projected)why='La consultation est projetée à '+hhmm(ref)+'. Wenare affiche l’heure officielle du passage.';
  else if(m.live)why='Wenare affiche '+m.value+' en rouge : le bus est estimé à '+hhmm(v.eta)+', selon une information reçue il y a '+m.age+' secondes. L’heure officielle est '+hhmm(v.official)+'.';
  else why='Wenare affiche '+m.value+' en noir d’après l’horaire officiel de '+hhmm(v.official)+'. '+(v.eta===null?'Aucune estimation n’est disponible pour ce passage.':'La dernière estimation date de '+Math.floor(m.age/60)+' min '+m.age%60+' s et a dépassé le seuil de fraîcheur.');
  $('why').textContent=why;$('detail').showModal();
}
$('detail').addEventListener('close',()=>opener?.focus());
$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
$('expiry').onclick=()=>{expired=!expired;render();};
$('projection').onclick=()=>{projected=!projected;render();};
$('scenario').onchange=()=>{expired=false;projected=false;render();};
render();
if(new URLSearchParams(location.search).get('detail')==='suivant'){
  const button=$('passes').querySelectorAll('button')[1];
  if(button)button.click();
}
</script></body></html>
